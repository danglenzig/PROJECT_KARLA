#- Qdrant vector_db on localhost:6333
#- ValKey (redis) on localhost:6379

# docker_compose.yml...

services:
  valkey:
    image: valkey/valkey
    ports:
      - 6379:6379
    volumes:
      - /mnt/c/KARLA/PROJECT_KARLA/valkey:/data
    restart: unless-stopped
  vector-db:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    volumes:
      - /mnt/c/KARLA/PROJECT_KARLA/qdrant_storage:/qdrant/storage
    restart: unless-stopped
